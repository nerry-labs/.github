name: Reusable deploy

on:
  workflow_call:
    inputs:
      subdomain:
        description: Full hostname this app serves, e.g. app.nerry.tech
        required: true
        type: string
      port:
        description: Port the app listens on inside its container
        required: true
        type: number
      mode:
        description: deploy or destroy
        required: false
        type: string
        default: deploy

permissions:
  contents: read
  packages: write

jobs:
  run:
    runs-on: ubuntu-latest
    environment: production

    env:
      APP: ${{ github.event.repository.name }}

    steps:
      - uses: actions/checkout@v4
        if: inputs.mode == 'deploy'

      - uses: docker/setup-buildx-action@v3
        if: inputs.mode == 'deploy'

      - uses: docker/login-action@v3
        if: inputs.mode == 'deploy'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: inputs.mode == 'deploy'
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.PROD_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # The registry token is this job's own GITHUB_TOKEN, piped over stdin.
      # It expires with the job, so no long-lived credential sits on the server.
      - name: Deploy
        if: inputs.mode == 'deploy'
        run: |
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | ssh \
            -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            "${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}" \
            "deploy $APP ${{ github.sha }} ${{ inputs.subdomain }} ${{ inputs.port }}"

      - name: Destroy
        if: inputs.mode == 'destroy'
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            "${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}" \
            "destroy $APP"

      - name: Clean up
        if: always()
        run: rm -f ~/.ssh/id_ed25519
