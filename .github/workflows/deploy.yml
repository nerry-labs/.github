name: Reusable deploy

on:
  workflow_call:
    inputs:
      images:
        description: >
          JSON array of images to build, each {name, context, dockerfile}.
          Published as ghcr.io/<org>/<repo>/<name>:<sha>.
        required: false
        type: string
        default: '[{"name":"server","context":".","dockerfile":"Dockerfile"}]'
      compose:
        description: Path to the compose file in the repo.
        required: false
        type: string
        default: docker-compose.yml
      mode:
        description: deploy or destroy
        required: false
        type: string
        default: deploy

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: inputs.mode == 'deploy'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.image.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

  ship:
    needs: [build]
    if: always() && (inputs.mode == 'destroy' || needs.build.result == 'success')
    runs-on: ubuntu-latest
    environment: production
    env:
      APP: ${{ github.event.repository.name }}

    steps:
      - uses: actions/checkout@v4
        if: inputs.mode == 'deploy'

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.PROD_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # The compose file and a short-lived registry token travel together on
      # stdin. The token is this job's own GITHUB_TOKEN and expires with the
      # job, so nothing long-lived is stored on the server.
      - name: Deploy
        if: inputs.mode == 'deploy'
        run: |
          test -f "${{ inputs.compose }}" || { echo "::error::${{ inputs.compose }} not found"; exit 1; }
          jq -nc \
            --arg token "${{ secrets.GITHUB_TOKEN }}" \
            --arg compose "$(base64 -w0 "${{ inputs.compose }}")" \
            '{token: $token, compose: $compose}' \
          | ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
              "${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}" \
              "deploy $APP ${{ github.sha }}"

      - name: Destroy
        if: inputs.mode == 'destroy'
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            "${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}" \
            "destroy $APP"

      - name: Clean up
        if: always()
        run: rm -f ~/.ssh/id_ed25519
